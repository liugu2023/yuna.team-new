# yuna CLI 的发版流水线。
#   打 tag cli-vX.Y.Z 后：类型检查 → 发布到 npm → 编译六个平台单文件二进制 → 建 GitHub Release
#   npm 使用仓库 secret NPM_TOKEN，或配置 trusted publishing（OIDC）。
#   也可以手动触发（workflow_dispatch），此时只跑检查与二进制编译，不会发布或建 Release。
#
# 刻意不在这里写 paths 过滤：GitHub 对 tag 推送不评估路径过滤，把 branches/paths 和 tags 写在同一个
# push 触发器里容易踩坑，所以这个 workflow 只由 tag 驱动；平时的检查见 ci.yml。
name: CLI 发版

on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 类型检查与编译
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 类型检查
        run: npm run cli:typecheck
      - name: 编译与回归测试（本地模拟 API）
        run: npm run cli:test
      - name: 检查 npm 包的必要文件和排除项
        run: node scripts/check-cli-release.mjs --package-only
      - name: 发版自检（tag 与版本号一致、private 已移除）
        if: startsWith(github.ref, 'refs/tags/cli-v')
        run: node scripts/check-cli-release.mjs

  publish:
    name: 发布到 npm
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/cli-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # 换成 trusted publishing（OIDC，不用 token）时需要
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: 用较新的 npm（npm 11.15+ 才有 stage 相关能力，OIDC 发布也要它）
        run: npm install -g npm@latest && npm --version
      - run: npm ci
      - run: npm run cli:build
      - name: 这个版本是否已经发布过
        id: exists
        working-directory: cli
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${name}@${version} 已经在 npm 上，跳过发布（重跑 tag 也能继续出二进制）"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 判断用哪种发布方式
        id: mode
        env:
          HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "检测到 NPM_TOKEN，按 token 方式发布"
          else
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
            echo "没有 NPM_TOKEN，按 trusted publishing（OIDC）发布"
          fi
      # 两种方式二选一：
      #   token —— 仓库 secret NPM_TOKEN（npm granular token，权限需为 Read and write，
      #            不要选 "Read and write (stage only)"，那种 token 被 npm 禁止直接 publish）
      #   OIDC  —— trusted publishing：在 npmjs.com 的包设置里配 Trusted Publisher
      #            （GitHub Actions / liugu2023 / yuna.team-new / cli.yml / 动作 npm publish），
      #            然后删掉 NPM_TOKEN secret 即可自动切换；无需 token，且自带 provenance。
      #            要求：本 job 已声明 id-token: write、Node ≥ 22.14、npm CLI ≥ 11.5.1（下面已升级）。
      - name: 确认将要上传的文件
        if: steps.exists.outputs.published == 'false'
        working-directory: cli
        run: npm publish --dry-run
      - name: npm publish（NPM_TOKEN）
        if: steps.exists.outputs.published == 'false' && steps.mode.outputs.mode == 'token'
        working-directory: cli
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: npm publish（trusted publishing / OIDC）
        if: steps.exists.outputs.published == 'false' && steps.mode.outputs.mode == 'oidc'
        working-directory: cli
        run: |
          # setup-node 会在临时 .npmrc 里写 //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}，
          # 走 OIDC 时把它删掉，避免空 token 干扰 npm 的 trusted publishing 判定
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
            echo "已从 .npmrc 移除 _authToken 行"
          fi
          npm publish

  binaries:
    name: 单文件二进制与 Release
    needs: [check, publish]
    # 手动构建会跳过 publish；显式状态条件避免依赖跳过导致整个 job 被跳过。
    # tag 构建仍须发布成功，取消或检查失败时不继续构建。
    if: >-
      ${{ always() && !cancelled() && needs.check.result == 'success' &&
          (needs.publish.result == 'success' ||
           (github.event_name == 'workflow_dispatch' && needs.publish.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # 建 Release、上传资产
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - run: npm run cli:build
      - name: 编译六个平台
        run: |
          set -euo pipefail
          mkdir -p dist
          # 不加 --minify：体积几乎都来自 bun 运行时，minify 没意义；--bytecode 反而更大
          # （本地实测：windows-x64 82.2MB，linux-x64 77.6MB，darwin-arm64 59.4MB）
          bun build --compile --target=bun-windows-x64  --outfile dist/yuna-windows-x64.exe  cli/bin/yuna.mjs
          bun build --compile --target=bun-windows-arm64 --outfile dist/yuna-windows-arm64.exe cli/bin/yuna.mjs
          bun build --compile --target=bun-darwin-x64   --outfile dist/yuna-darwin-x64    cli/bin/yuna.mjs
          bun build --compile --target=bun-darwin-arm64 --outfile dist/yuna-darwin-arm64  cli/bin/yuna.mjs
          bun build --compile --target=bun-linux-x64    --outfile dist/yuna-linux-x64     cli/bin/yuna.mjs
          bun build --compile --target=bun-linux-arm64  --outfile dist/yuna-linux-arm64   cli/bin/yuna.mjs
          ls -lh dist
      - name: 用本机平台产物冒烟（Linux runner 上跑 linux-x64）
        run: |
          set -euo pipefail
          chmod +x dist/yuna-linux-x64
          ./dist/yuna-linux-x64 --version
          ./dist/yuna-linux-x64 --help > /dev/null
          ./dist/yuna-linux-x64 open home --base https://example.invalid --json > dist/smoke-open.json
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const result = JSON.parse(fs.readFileSync("dist/smoke-open.json", "utf8")); assert.equal(result.target, "home"); assert.equal(result.url, "https://example.invalid/");'
          if ./dist/yuna-linux-x64 posts --nope; then
            echo "未知参数本应返回非 0"; exit 1
          fi
      - name: 打包并算校验和（82MB → zip 约 39MB）
        run: |
          set -euo pipefail
          cd dist
          zip -9 yuna-windows-x64.zip yuna-windows-x64.exe
          zip -9 yuna-windows-arm64.zip yuna-windows-arm64.exe
          tar -czf yuna-darwin-x64.tar.gz yuna-darwin-x64
          tar -czf yuna-darwin-arm64.tar.gz yuna-darwin-arm64
          tar -czf yuna-linux-x64.tar.gz yuna-linux-x64
          tar -czf yuna-linux-arm64.tar.gz yuna-linux-arm64
          sha256sum yuna-*.zip yuna-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: 创建或更新 Release 资产（仅 tag 触发时）
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/cli-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/*.zip dist/*.tar.gz dist/SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/*.zip dist/*.tar.gz dist/SHA256SUMS.txt \
              --title "yuna CLI $GITHUB_REF_NAME" \
              --generate-notes
          fi
      - name: 手动触发时只留构建产物
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: yuna-cli-binaries
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
