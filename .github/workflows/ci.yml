# 日常检查：站点与 CLI 的类型/样式/脚本自检。改到哪块就查哪块。
name: 检查

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: 站点（Functions 类型 / 样式 / 脚本依赖）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Functions 类型检查
        run: npx tsc --noEmit
      - name: 样式自检
        run: npm run styles:check
      - name: 脚本依赖自检
        run: npm run scripts:check

  cli:
    name: CLI（${{ matrix.os }} / Node ${{ matrix.node }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run cli:typecheck
      - name: 编译与回归测试（本地模拟 API）
        run: npm run cli:test
      - name: 检查 npm 包的必要文件和排除项
        run: node scripts/check-cli-release.mjs --package-only

  cli-minimum-node:
    name: CLI 最低运行版本（Node 18.17）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 网站开发依赖需要较新的 Node，只有安装和构建使用 Node 22。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cli:build
      - uses: actions/setup-node@v4
        with:
          node-version: 18.17.0
      - name: 用包声明的最低 Node 版本运行已编译 CLI 的回归测试
        run: node scripts/test-cli.mjs
